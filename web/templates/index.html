<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proppant Transport Simulator</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="light-theme">
    <header>
        <h1>Proppant Transport Simulator</h1>
        <button id="theme-toggle" class="theme-btn" title="Toggle theme">
            <span class="icon-sun">&#9728;</span>
            <span class="icon-moon">&#9790;</span>
        </button>
    </header>

    <main>
        <aside class="parameters-panel">
            <h2>Parameters</h2>

            <div class="param-group">
                <label for="c_in">Inlet Concentration:</label>
                <input type="number" id="c_in" value="0.3" step="0.01" min="0.1" max="0.5">
            </div>

            <div class="param-group">
                <label for="w0">Fracture Aperture (m):</label>
                <input type="number" id="w0" value="0.005" step="0.001" min="0.001" max="0.01">
            </div>

            <div class="param-group">
                <label for="mu0">Viscosity (Pa·s):</label>
                <input type="number" id="mu0" value="0.001" step="0.0001" min="0.0001" max="0.01">
            </div>

            <div class="param-group">
                <label for="Q">Flow Rate (m²/s):</label>
                <input type="number" id="Q" value="0.05" step="0.01" min="0.01" max="0.1">
            </div>

            <div class="param-group">
                <label for="chi">Chi:</label>
                <input type="number" id="chi" value="5.0" step="0.5" min="1.0" max="10.0">
            </div>

            <div class="param-group">
                <label for="c_in_times">Injection Time (s):</label>
                <input type="number" id="c_in_times" value="50" step="5" min="10" max="200">
            </div>

            <button id="run-btn" class="run-btn">
                <span class="btn-text">RUN SIMULATION</span>
                <span class="btn-loader"></span>
            </button>

            <div id="status-message" class="status-message"></div>

            <div class="metrics-panel">
                <h3>Metrics</h3>
                <div class="metric">
                    <span class="metric-label">NN Time:</span>
                    <span id="nn-time" class="metric-value">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">NS Time:</span>
                    <span id="ns-time" class="metric-value">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Speedup:</span>
                    <span id="speedup" class="metric-value">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">L2 Error:</span>
                    <span id="l2-error" class="metric-value">-</span>
                </div>
            </div>
        </aside>

        <section class="visualization-area">
            <div class="plot-container">
                <h3>Neural Network Model</h3>
                <div id="nn-plot" class="plot"></div>
            </div>

            <div class="plot-container">
                <h3>Numerical Solver (NS)</h3>
                <div id="ns-plot" class="plot"></div>
            </div>

            <div class="timelapse-controls">
                <button id="play-btn" class="control-btn" title="Play/Pause">
                    <span class="play-icon">&#9658;</span>
                    <span class="pause-icon">&#10074;&#10074;</span>
                </button>
                <span id="time-current" class="time-label">0.0 s</span>
                <input type="range" id="time-slider" min="0" max="100" value="0" step="1">
                <span id="time-max" class="time-label">100.0 s</span>
                <div class="speed-control">
                    <label for="playback-speed">Speed:</label>
                    <select id="playback-speed">
                        <option value="0.5">0.5x</option>
                        <option value="1" selected>1x</option>
                        <option value="2">2x</option>
                        <option value="4">4x</option>
                    </select>
                </div>
            </div>
        </section>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
